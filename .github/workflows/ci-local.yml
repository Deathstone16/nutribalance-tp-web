name: Frontend - CI y despliegue local

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_SITE_ORIGIN: https://api.neadev.com
      EXPRESS_ALLOWED_ORIGIN: https://api.neadev.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm typecheck
      - run: node --check scripts/serve-expo.mjs

  request-deployment:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Solicitar despliegue en la PC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "require('fs').writeFileSync('deployment.json', JSON.stringify({ref:process.env.GITHUB_SHA, environment:'local-cloudflare', auto_merge:false, required_contexts:[], production_environment:true, description:'CI aprobada. Esperando al agente local.'}))"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input deployment.json --jq .id
