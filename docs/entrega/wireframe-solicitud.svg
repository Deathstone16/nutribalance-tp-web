<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1190" viewBox="0 0 500 1190" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe móvil de solicitud de turno</title>
  <desc id="desc">Cabecera, explicación, datos de contacto, selección de fecha y horario, confirmación de datos ficticios y envío.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#293a35} .label{font-size:17px;font-weight:700} .small{font-size:14px} .muted{fill:#6d7b75} .line{stroke:#b7c4bd;stroke-width:2;stroke-linecap:round} .box{fill:#fff;stroke:#9aaba2;stroke-width:2} .accent{fill:#244b3d} .inverse{fill:white}</style>
  <rect width="500" height="1190" fill="#edf2ed"/>
  <rect x="28" y="25" width="444" height="1135" rx="20" fill="#fafbf8" stroke="#a4b4aa" stroke-width="2"/>
  <text x="55" y="69" class="label">NUTRIBALANCE</text>
  <rect x="366" y="43" width="75" height="36" rx="18" class="box"/><text x="403" y="66" class="small" text-anchor="middle">Menú</text>
  <line x1="28" y1="99" x2="472" y2="99" class="line"/>
  <text x="55" y="137" class="small muted">← Volver al inicio</text>
  <text x="55" y="194" font-size="31" font-family="Georgia,serif" fill="#293a35">El primer paso</text>
  <text x="55" y="234" font-size="31" font-family="Georgia,serif" fill="#293a35">es conversar.</text>
  <line x1="55" y1="270" x2="426" y2="270" class="line"/><line x1="55" y1="292" x2="394" y2="292" class="line"/>
  <rect x="55" y="324" width="390" height="92" rx="4" fill="#f1f5ef" stroke="#a4b4aa"/>
  <text x="75" y="352" class="small">Qué pasa después</text>
  <text x="75" y="378" class="small muted">✓ Código · ✓ Pendiente · ✓ 30 minutos</text>
  <rect x="47" y="449" width="406" height="660" rx="4" fill="#fff" stroke="#9aaba2" stroke-width="2"/>
  <text x="69" y="487" class="label">Datos para contactarte</text>
  <text x="69" y="514" class="small muted">Los campos con * son obligatorios</text>
  <text x="69" y="550" class="small">Nombre y apellido *</text><rect x="69" y="560" width="362" height="42" rx="3" class="box"/>
  <text x="69" y="633" class="small">Teléfono *</text><rect x="69" y="643" width="362" height="42" rx="3" class="box"/>
  <text x="69" y="716" class="small">Correo electrónico · opcional</text><rect x="69" y="726" width="362" height="42" rx="3" class="box"/>
  <line x1="69" y1="795" x2="431" y2="795" class="line"/>
  <text x="69" y="829" class="label">Elegí tu próximo encuentro</text>
  <text x="69" y="863" class="small">Fecha *</text><rect x="69" y="873" width="362" height="42" rx="3" class="box"/>
  <text x="69" y="947" class="small">Horario disponible *</text>
  <rect x="69" y="960" width="108" height="39" rx="4" class="box"/><text x="123" y="986" class="small" text-anchor="middle">09:00</text>
  <rect x="187" y="960" width="108" height="39" rx="4" class="box"/><text x="241" y="986" class="small" text-anchor="middle">09:30</text>
  <rect x="305" y="960" width="108" height="39" rx="4" class="box"/><text x="359" y="986" class="small" text-anchor="middle">10:00</text>
  <rect x="69" y="1022" width="18" height="18" rx="2" class="box"/><text x="95" y="1036" class="small">Confirmo datos ficticios *</text>
  <rect x="69" y="1052" width="362" height="43" rx="21" class="accent"/><text x="250" y="1080" class="small inverse" text-anchor="middle">Enviar solicitud →</text>
  <text x="250" y="1140" class="small muted" text-anchor="middle">VISTA MÓVIL · DESPLAZAMIENTO VERTICAL</text>
</svg>
