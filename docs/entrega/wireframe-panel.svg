<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe del panel profesional</title>
  <desc id="desc">Navegación lateral con resumen, pacientes y agenda; contenido principal con turnos pendientes y acciones de ficha y consulta.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#293a35} .label{font-size:18px;font-weight:700} .small{font-size:14px} .muted{fill:#6d7b75} .line{stroke:#b7c4bd;stroke-width:2;stroke-linecap:round} .box{fill:#fff;stroke:#98a9a1;stroke-width:2} .accent{fill:#244b3d} .inverse{fill:white}</style>
  <rect width="1280" height="790" fill="#edf2ed"/>
  <rect x="30" y="30" width="1220" height="720" rx="9" fill="#fafbf8" stroke="#a4b4aa" stroke-width="2"/>
  <rect x="30" y="30" width="240" height="720" fill="#f5f7f3" stroke="#a4b4aa" stroke-width="2"/>
  <text x="55" y="81" class="label">NUTRIBALANCE</text>
  <line x1="55" y1="111" x2="245" y2="111" class="line"/>
  <text x="56" y="153" class="small muted">CONSULTORIO</text>
  <rect x="47" y="174" width="203" height="42" rx="5" fill="#dfe9df"/>
  <text x="67" y="201" class="small">Resumen</text>
  <text x="67" y="250" class="small">Pacientes</text><text x="67" y="295" class="small">Agenda</text>
  <text x="67" y="340" class="small">Configuración</text>
  <text x="55" y="699" class="small muted">Cuenta profesional</text>
  <line x1="270" y1="101" x2="1250" y2="101" class="line"/>
  <text x="307" y="74" class="small muted">Panel / Resumen</text>
  <text x="307" y="158" font-size="32" font-family="Georgia,serif" fill="#293a35">Hoy en el consultorio</text>
  <text x="307" y="187" class="small muted">Agenda, pacientes y seguimientos</text>
  <rect x="1045" y="133" width="165" height="43" rx="4" class="accent"/><text x="1127" y="161" class="small inverse" text-anchor="middle">+ Nuevo paciente</text>
  <rect x="306" y="219" width="585" height="226" rx="6" class="box"/>
  <text x="330" y="255" class="label">Próximos turnos</text>
  <line x1="330" y1="277" x2="867" y2="277" class="line"/>
  <text x="330" y="315" class="small">09:00</text><text x="427" y="315" class="small">Solicitud pendiente · contacto</text>
  <rect x="718" y="290" width="150" height="35" rx="4" class="box"/><text x="793" y="313" class="small" text-anchor="middle">Confirmar turno</text>
  <line x1="330" y1="340" x2="867" y2="340" class="line"/>
  <text x="330" y="381" class="small">10:30</text><text x="427" y="381" class="small">Turno confirmado · paciente</text>
  <rect x="718" y="356" width="150" height="35" rx="4" class="box"/><text x="793" y="379" class="small" text-anchor="middle">Abrir ficha</text>
  <rect x="913" y="219" width="297" height="226" rx="6" class="box"/>
  <text x="936" y="255" class="label">Acciones rápidas</text>
  <text x="936" y="306" class="small">Buscar paciente →</text>
  <line x1="936" y1="328" x2="1186" y2="328" class="line"/>
  <text x="936" y="365" class="small">Ver agenda →</text>
  <line x1="936" y1="386" x2="1186" y2="386" class="line"/>
  <rect x="306" y="470" width="904" height="222" rx="6" class="box"/>
  <text x="330" y="507" class="label">Ficha e historial del paciente</text>
  <text x="330" y="541" class="small muted">Se abre desde Pacientes o desde un turno vinculado</text>
  <rect x="330" y="563" width="245" height="93" rx="4" fill="#f1f5ef" stroke="#a4b4aa"/>
  <text x="350" y="595" class="small">Datos y antecedentes</text><line x1="350" y1="616" x2="542" y2="616" class="line"/>
  <rect x="591" y="563" width="245" height="93" rx="4" fill="#f1f5ef" stroke="#a4b4aa"/>
  <text x="611" y="595" class="small">Consultas anteriores</text><line x1="611" y1="616" x2="803" y2="616" class="line"/>
  <rect x="861" y="584" width="284" height="44" rx="4" class="accent"/><text x="1003" y="612" class="small inverse" text-anchor="middle">Registrar consulta →</text>
  <text x="1180" y="727" class="small muted" text-anchor="end">PANEL · ESTRUCTURA DEL FLUJO REAL</text>
</svg>
