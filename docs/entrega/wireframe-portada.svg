  <title id="title">Wireframe de la portada de NutriBalance</title>
  <desc id="desc">Hero editorial sobre marfil con titular a la izquierda y fotografía del plato a la derecha. Debajo empieza una sección verde con los tres pasos para solicitar turno.</desc>
